<!doctype html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A4220">
  <title>অ্যাডমিন — Farzana's Home Made Achar</title>
  <link rel="icon" href="images/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Galada&family=Hind+Siliguri:wght@400;500;600;700&family=Lobster&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="a-dash" viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 4v4h6V4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="a-order" viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></symbol>
      <symbol id="a-user" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18 14.8c2 .7 3.2 2.4 3.5 5.2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="a-jar" viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="4" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M6.5 7h11c1 0 1.5.8 1.5 2v10a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V9c0-1.2.5-2 1.5-2zM5 12h14" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="a-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="a-store" viewBox="0 0 24 24"><path d="M4 9.5 5.5 4h13L20 9.5M4 9.5V20h16V9.5M4 9.5c0 1.7 1.3 2.5 2.7 2.5s2.6-.8 2.6-2.5c0 1.7 1.3 2.5 2.7 2.5s2.7-.8 2.7-2.5c0 1.7 1.2 2.5 2.6 2.5S20 11.2 20 9.5M10 20v-5h4v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="a-out" viewBox="0 0 24 24"><path d="M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="a-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="a-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></symbol>
      <symbol id="a-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="m20 20-3.5-3.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
      <symbol id="a-down" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="a-edit" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM13.5 6.5l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="a-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4.5h6V7M6.5 7l1 13h9l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="a-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="a-print" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 17H4v-7h16v7h-3M7 14h10v7H7z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="a-phone" viewBox="0 0 24 24"><path d="M5 3.5h3.5l1.5 4.5-2.2 1.4a11 11 0 0 0 6.8 6.8L16 14l4.5 1.5V19a1.5 1.5 0 0 1-1.6 1.5A16.5 16.5 0 0 1 3.5 5.1 1.5 1.5 0 0 1 5 3.5z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="a-chat" viewBox="0 0 24 24"><path d="M12 3a9 9 0 0 0-7.8 13.5L3 21l4.6-1.2A9 9 0 1 0 12 3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="a-up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="a-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    </defs>
  </svg>

  <!-- Login -->
  <section class="login" id="login" hidden>
    <form class="login-card" id="loginForm">
      <span class="brand-mark">Farzana's</span>
      <h1>অ্যাডমিন প্যানেল</h1>
      <p>স্টোর পরিচালনা করতে লগ ইন করুন।</p>
      <label class="fld"><span>ইউজারনেম</span><input name="user" autocomplete="username" required></label>
      <label class="fld"><span>পাসওয়ার্ড</span><input name="pass" type="password" autocomplete="current-password" required></label>
      <p class="login-err" id="loginErr" hidden>ইউজারনেম বা পাসওয়ার্ড ভুল। আবার চেষ্টা করুন।</p>
      <button class="btn btn-green btn-block" type="submit">লগ ইন</button>
      <a class="login-back" href="index.html">← স্টোরে ফিরে যান</a>
    </form>
  </section>

  <!-- App shell -->
  <div class="shell" id="shell" hidden>
    <aside class="side">
      <a class="side-brand" href="#dashboard"><span class="brand-mark">Farzana's</span><small>অ্যাডমিন</small></a>
      <nav class="side-nav" id="sideNav">
        <a href="#dashboard" data-page="dashboard"><svg><use href="#a-dash"/></svg><span>ড্যাশবোর্ড</span></a>
        <a href="#orders" data-page="orders"><svg><use href="#a-order"/></svg><span>অর্ডার</span><i class="nav-badge" id="navPending"></i></a>
        <a href="#customers" data-page="customers"><svg><use href="#a-user"/></svg><span>কাস্টমার</span></a>
        <a href="#products" data-page="products"><svg><use href="#a-jar"/></svg><span>প্রোডাক্ট</span></a>
        <a href="#settings" data-page="settings"><svg><use href="#a-gear"/></svg><span>সেটিংস</span></a>
      </nav>
      <div class="side-foot">
        <a href="index.html" target="_blank"><svg><use href="#a-store"/></svg><span>স্টোর দেখুন</span></a>
        <button id="logout"><svg><use href="#a-out"/></svg><span>লগ আউট</span></button>
      </div>
    </aside>
    <main class="main">
      <header class="main-head">
        <h1 id="pageTitle">ড্যাশবোর্ড</h1>
        <div class="head-actions" id="headActions"></div>
      </header>
      <div class="page" id="page"></div>
    </main>
  </div>

  <!-- Drawer & modal -->
  <div class="drawer" id="drawer" hidden><div class="drawer-back" data-close></div><aside class="drawer-card" id="drawerCard"></aside></div>
  <div class="amodal" id="amodal" hidden><div class="amodal-back" data-close></div><div class="amodal-card" id="amodalCard"></div></div>
  <div class="atoasts" id="atoasts"></div>
  <div id="printArea"></div>

  <script src="js/store.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/admin-orders.js"></script>
  <script src="js/admin-catalog.js"></script>
</body>
</html>
